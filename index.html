<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GitChat - 私密聊天室</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #1a1a2e;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        .app-container {
            display: flex;
            height: 100vh;
            width: 100%;
            background: #f0f2f5;
            position: relative;
        }

        /* ========= 侧边栏 ========= */
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: #2c3e50;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            transition: left 0.3s ease;
            z-index: 1000;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.3);
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            display: none;
        }

        .sidebar-overlay.open {
            display: block;
        }

        @media (min-width: 768px) {
            .sidebar {
                position: relative;
                left: 0 !important;
                width: 280px;
            }
            .sidebar-overlay {
                display: none !important;
            }
            .menu-toggle {
                display: none !important;
            }
        }

        .menu-toggle {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1001;
            background: #1abc9c;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .user-profile {
            padding: 24px 20px;
            background: #1e2a36;
            border-bottom: 1px solid #3a4a5a;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: white;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-weight: 600;
            font-size: 16px;
        }

        .user-status {
            font-size: 12px;
            color: #95a5a6;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background: #2ecc71;
            border-radius: 50%;
        }

        .logout-btn {
            background: #e74c3c;
            border: none;
            border-radius: 20px;
            padding: 4px 12px;
            color: white;
            font-size: 12px;
            cursor: pointer;
        }

        .action-buttons {
            padding: 12px 16px;
            display: flex;
            gap: 12px;
            border-bottom: 1px solid #3a4a5a;
        }

        .action-btn {
            flex: 1;
            padding: 8px 12px;
            background: #1abc9c;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 12px;
            cursor: pointer;
        }

        .lists-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 16px 0;
        }

        .list-header {
            padding: 12px 20px 6px 20px;
            font-size: 12px;
            font-weight: 600;
            color: #7f8c8d;
        }

        .contact-item, .group-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            margin: 2px 8px;
            border-radius: 12px;
            cursor: pointer;
        }

        .contact-item:hover, .group-item:hover {
            background: #3a5468;
        }

        .contact-item.active, .group-item.active {
            background: #1abc9c;
            color: white;
        }

        .contact-avatar, .group-avatar {
            width: 40px;
            height: 40px;
            background: #4a627a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
        }

        .contact-info, .group-info {
            flex: 1;
        }

        .contact-name, .group-name {
            font-size: 15px;
            font-weight: 500;
        }

        .contact-meta, .group-meta {
            font-size: 11px;
            color: #95a5a6;
        }

        /* 聊天区域 */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f8f9fa;
            width: 100%;
            height: 100vh;
        }

        .chat-header {
            background: white;
            padding: 12px 16px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-contact-name {
            font-weight: 600;
            font-size: 16px;
            color: #2c3e50;
        }

        .chat-contact-type {
            font-size: 11px;
            background: #e9ecef;
            padding: 2px 8px;
            border-radius: 20px;
            color: #6c757d;
        }

        .add-member-header-btn {
            background: #1abc9c;
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            color: white;
            font-size: 11px;
            cursor: pointer;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message-row {
            display: flex;
            width: 100%;
        }

        .message-row.own {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message-row:not(.own) .message-bubble {
            background: white;
            border-top-left-radius: 4px;
            color: #2d3436;
            border: 1px solid #e2e8f0;
        }

        .message-row.own .message-bubble {
            background: #1abc9c;
            color: white;
            border-top-right-radius: 4px;
        }

        .message-time {
            font-size: 10px;
            margin-top: 4px;
            opacity: 0.6;
            text-align: right;
        }

        /* ========= 输入框区域 - 确保显示 ========= */
        .input-area {
            background: white;
            border-top: 1px solid #e9ecef;
            padding: 10px 12px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }

        .input-area input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #dee2e6;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            background: white;
            color: #333;
        }

        .input-area input:focus {
            border-color: #1abc9c;
            box-shadow: 0 0 0 2px rgba(26,188,156,0.2);
        }

        .send-btn {
            background: #1abc9c;
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        .empty-chat {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #adb5bd;
            flex-direction: column;
            gap: 12px;
        }

        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .login-box {
            background: white;
            padding: 28px 24px;
            border-radius: 24px;
            width: 90%;
            max-width: 340px;
        }

        .login-box h3 {
            margin-bottom: 20px;
            color: #2c3e50;
            text-align: center;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #dee2e6;
            border-radius: 12px;
            font-size: 14px;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            background: #1abc9c;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .login-box .error {
            color: #e74c3c;
            font-size: 12px;
            text-align: center;
        }

        .register-link {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
        }

        .register-link a {
            color: #1abc9c;
            text-decoration: none;
            cursor: pointer;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 300px;
        }

        .modal-content h4 {
            margin-bottom: 16px;
            color: #2c3e50;
        }

        .modal-content input, .modal-content select {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
        }

        .modal-content button {
            width: 100%;
            padding: 10px;
            background: #1abc9c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .modal-content .close {
            background: #95a5a6;
            margin-top: 8px;
        }
    </style>
</head>
<body>
<button class="menu-toggle" id="menuToggle">☰</button>

<div class="app-container" id="app" style="display: none;">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    
    <div class="sidebar" id="sidebar">
        <div class="user-profile">
            <div class="avatar" id="currentUserAvatar">我</div>
            <div class="user-info">
                <div class="user-name" id="currentUserName"></div>
                <div class="user-status"><span class="online-dot"></span> 在线 · 私密聊天</div>
            </div>
            <button class="logout-btn" id="logoutBtn">退出</button>
        </div>

        <div class="action-buttons">
            <button class="action-btn" id="addFriendBtn">添加好友</button>
            <button class="action-btn" id="createGroupBtn">创建群聊</button>
        </div>

        <div class="lists-scroll">
            <div class="list-header">我的好友</div>
            <div id="friendsList"></div>
            <div class="list-header" style="margin-top: 16px;">我的群聊</div>
            <div id="groupsList"></div>
        </div>
    </div>

    <div class="chat-area">
        <div class="chat-header" id="chatHeader">
            <div class="chat-contact-info">
                <div class="chat-contact-name" id="chatContactName">请选择一个好友或群聊</div>
                <div class="chat-contact-type" id="chatContactType">私聊</div>
            </div>
            <button class="add-member-header-btn" id="addMemberBtn" style="display: none;">添加成员</button>
        </div>

        <div class="messages-container" id="messagesContainer">
            <div class="empty-chat">聊天记录<br>点击左侧联系人，开始聊天</div>
        </div>

        <!-- 输入框区域 - 确保存在 -->
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="输入消息..." autocomplete="off">
            <button class="send-btn" id="sendBtn">发送</button>
        </div>
    </div>
</div>

<div class="login-overlay" id="loginOverlay">
    <div class="login-box" id="loginBox">
        <h3 id="formTitle">GitChat 登录</h3>
        <input type="text" id="loginUsername" placeholder="用户名" autocomplete="off">
        <input type="password" id="loginPassword" placeholder="密码">
        <div id="formMessage" class="error"></div>
        <button id="submitBtn">登录</button>
        <div class="register-link">
            <a id="toggleFormBtn">没有账号？去注册</a>
        </div>
    </div>
</div>

<script>
    // ========== 配置 ==========
    const GITHUB_CONFIG = {
        owner: "s220515001",
        repo: "my-chat-system",
        branch: "main"
    };
    const TOKEN_BIN_ID = "6a296f88da38895dfea6e9b3";
    const MESSAGES_GIST_ID = "07ba593a56998e7c9ec7651702ec9c53";

    let currentUser = null;
    let friendsData = [];
    let groupsData = [];
    let activeChat = { id: null, type: null, name: null };
    let isLoginMode = true;
    let cachedToken = null;
    let pollInterval = null;

    function closeSidebar() {
        document.getElementById('sidebar')?.classList.remove('open');
        document.getElementById('sidebarOverlay')?.classList.remove('open');
    }

    function openSidebar() {
        document.getElementById('sidebar')?.classList.add('open');
        document.getElementById('sidebarOverlay')?.classList.add('open');
    }

    function getPrivateChatId(user1, user2) {
        const sorted = [user1, user2].sort();
        return `chat_${sorted[0]}_${sorted[1]}`;
    }

    async function getGitHubToken() {
        if (cachedToken) return cachedToken;
        try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${TOKEN_BIN_ID}/latest`);
            const data = await res.json();
            cachedToken = data.record.github_token;
            return cachedToken;
        } catch(e) {
            throw new Error('无法获取令牌');
        }
    }

    function decodeBase64(str) {
        try {
            return decodeURIComponent(escape(atob(str)));
        } catch(e) {
            return atob(str);
        }
    }

    async function readGitHubFile(filename) {
        const token = await getGitHubToken();
        const url = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${filename}?ref=${GITHUB_CONFIG.branch}`;
        const res = await fetch(url, {
            headers: { 'Authorization': `token ${token}`, 'User-Agent': 'GitChat-App' }
        });
        if (res.status === 404) return null;
        if (!res.ok) throw new Error(`读取失败: ${res.status}`);
        const data = await res.json();
        return JSON.parse(decodeBase64(data.content));
    }

    async function writeGitHubFile(filename, content, msg) {
        const token = await getGitHubToken();
        const url = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${filename}?ref=${GITHUB_CONFIG.branch}`;
        let sha = null;
        try {
            const readRes = await fetch(url, {
                headers: { 'Authorization': `token ${token}`, 'User-Agent': 'GitChat-App' }
            });
            if (readRes.ok) sha = (await readRes.json()).sha;
        } catch(e) {}
        const body = {
            message: msg,
            content: btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2)))),
            branch: GITHUB_CONFIG.branch
        };
        if (sha) body.sha = sha;
        const writeRes = await fetch(url, {
            method: 'PUT',
            headers: {
                'Authorization': `token ${token}`,
                'Content-Type': 'application/json',
                'User-Agent': 'GitChat-App'
            },
            body: JSON.stringify(body)
        });
        if (!writeRes.ok) throw new Error(`写入失败: ${writeRes.status}`);
        return await writeRes.json();
    }

    async function loadMessages() {
        try {
            const token = await getGitHubToken();
            const res = await fetch(`https://api.github.com/gists/${MESSAGES_GIST_ID}`, {
                headers: { 'Authorization': `token ${token}`, 'User-Agent': 'GitChat-App' }
            });
            if (!res.ok) return [];
            const data = await res.json();
            const content = data.files['messages.json']?.content;
            if (!content) return [];
            const msgs = JSON.parse(content);
            return Array.isArray(msgs) ? msgs : [];
        } catch(e) {
            return [];
        }
    }

    async function saveMessages(messages) {
        try {
            const token = await getGitHubToken();
            const infoRes = await fetch(`https://api.github.com/gists/${MESSAGES_GIST_ID}`, {
                headers: { 'Authorization': `token ${token}`, 'User-Agent': 'GitChat-App' }
            });
            if (!infoRes.ok) return false;
            const gistData = await infoRes.json();
            const fileSha = gistData.files['messages.json'].sha;
            const updateRes = await fetch(`https://api.github.com/gists/${MESSAGES_GIST_ID}`, {
                method: 'PATCH',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json',
                    'User-Agent': 'GitChat-App'
                },
                body: JSON.stringify({
                    files: { 'messages.json': { content: JSON.stringify(messages, null, 2), sha: fileSha } }
                })
            });
            return updateRes.ok;
        } catch(e) {
            return false;
        }
    }

    async function addMessage(msg) {
        const all = await loadMessages();
        all.push(msg);
        return await saveMessages(all);
    }

    async function getMessagesForChat(chatId) {
        const all = await loadMessages();
        return all.filter(m => m.targetId === chatId);
    }

    async function register(user, pwd) {
        if (user.length < 3 || pwd.length < 3) {
            document.getElementById('formMessage').innerText = '用户名/密码至少3字符';
            return false;
        }
        try {
            const users = await readGitHubFile('users.json') || {};
            if (users[user]) {
                document.getElementById('formMessage').innerText = '用户名已存在';
                return false;
            }
            users[user] = { password: pwd, nickname: user };
            await writeGitHubFile('users.json', users, `注册: ${user}`);
            document.getElementById('formMessage').innerText = '注册成功！请登录';
            return true;
        } catch(e) {
            document.getElementById('formMessage').innerText = '注册失败';
            return false;
        }
    }

    async function login(user, pwd) {
        try {
            const users = await readGitHubFile('users.json');
            if (!users) {
                document.getElementById('formMessage').innerText = 'users.json 不存在';
                return false;
            }
            if (users[user] && users[user].password === pwd) {
                currentUser = {
                    username: user,
                    nickname: users[user].nickname || user,
                    avatar: (users[user].nickname || user).charAt(0)
                };
                localStorage.setItem('chatUser', JSON.stringify(currentUser));
                return true;
            }
            document.getElementById('formMessage').innerText = '用户名或密码错误';
            return false;
        } catch(e) {
            document.getElementById('formMessage').innerText = '读取失败';
            return false;
        }
    }

    async function loadFriends() {
        try {
            const friendships = await readGitHubFile('friendships.json');
            if (!friendships) return [];
            const myFriends = [];
            for (const f of friendships) {
                if (f.user1 === currentUser.username) myFriends.push(f.user2);
                else if (f.user2 === currentUser.username) myFriends.push(f.user1);
            }
            const users = await readGitHubFile('users.json') || {};
            return myFriends.map(f => ({
                id: getPrivateChatId(currentUser.username, f),
                username: f,
                nickname: users[f]?.nickname || f,
                avatar: (users[f]?.nickname || f).charAt(0),
                type: 'friend'
            }));
        } catch(e) {
            return [];
        }
    }

    async function addFriend(friendName) {
        if (friendName === currentUser.username) { alert('不能加自己'); return false; }
        try {
            const friendships = (await readGitHubFile('friendships.json')) || [];
            if (friendships.some(f => (f.user1 === currentUser.username && f.user2 === friendName) ||
                                      (f.user1 === friendName && f.user2 === currentUser.username))) {
                alert('已是好友'); return false;
            }
            const users = await readGitHubFile('users.json');
            if (!users || !users[friendName]) { alert('用户不存在'); return false; }
            friendships.push({ user1: currentUser.username, user2: friendName });
            await writeGitHubFile('friendships.json', friendships, `加好友: ${currentUser.username} ↔ ${friendName}`);
            return true;
        } catch(e) {
            alert('添加失败');
            return false;
        }
    }

    async function loadGroups() {
        try {
            const groups = await readGitHubFile('groups.json');
            if (!groups) return [];
            return groups.filter(g => g.members?.includes(currentUser.username)).map(g => ({
                id: `group_${g.id}`,
                groupId: g.id,
                groupName: g.groupName,
                avatar: g.groupName.charAt(0),
                type: 'group',
                members: g.members || []
            }));
        } catch(e) {
            return [];
        }
    }

    async function createGroup(name) {
        if (!name) { alert('请输入群名'); return false; }
        try {
            const groups = (await readGitHubFile('groups.json')) || [];
            const newGroup = { id: Date.now().toString(), groupName: name, members: [currentUser.username] };
            groups.push(newGroup);
            await writeGitHubFile('groups.json', groups, `创建群: ${name}`);
            return true;
        } catch(e) {
            alert('创建失败');
            return false;
        }
    }

    async function addMemberToGroup(groupId, member) {
        if (member === currentUser.username) { alert('不能加自己'); return false; }
        try {
            const groups = await readGitHubFile('groups.json');
            const idx = groups.findIndex(g => g.id === groupId);
            if (idx === -1) { alert('群不存在'); return false; }
            if (groups[idx].members.includes(member)) { alert('已在群中'); return false; }
            groups[idx].members.push(member);
            await writeGitHubFile('groups.json', groups, `加成员: ${member} 到 ${groups[idx].groupName}`);
            return true;
        } catch(e) {
            alert('添加失败');
            return false;
        }
    }

    async function sendMessageToChat(chatId, type, content) {
        const msg = {
            id: Date.now(),
            from: currentUser.username,
            fromNickname: currentUser.nickname,
            targetId: chatId,
            targetType: type,
            content: content,
            timestamp: Date.now()
        };
        const ok = await addMessage(msg);
        if (ok && activeChat.id === chatId) {
            const msgs = await getMessagesForChat(chatId);
            renderMessages(msgs);
        }
        return ok;
    }

    function renderFriendsList(list) {
        const container = document.getElementById('friendsList');
        if (!container) return;
        if (!list.length) { container.innerHTML = '<div style="padding:12px 20px;color:#95a5a6">暂无好友</div>'; return; }
        container.innerHTML = list.map(f => `
            <div class="contact-item ${activeChat.id === f.id ? 'active' : ''}" data-id="${f.id}" data-type="friend" data-name="${f.nickname}">
                <div class="contact-avatar">${f.avatar}</div>
                <div class="contact-info">
                    <div class="contact-name">${f.nickname}</div>
                    <div class="contact-meta">@${f.username}</div>
                </div>
            </div>
        `).join('');
        document.querySelectorAll('.contact-item').forEach(el => {
            el.addEventListener('click', () => {
                switchChat(el.dataset.id, el.dataset.type, el.dataset.name);
                if (window.innerWidth < 768) closeSidebar();
            });
        });
    }

    function renderGroupsList(list) {
        const container = document.getElementById('groupsList');
        if (!container) return;
        if (!list.length) { container.innerHTML = '<div style="padding:12px 20px;color:#95a5a6">暂无群聊</div>'; return; }
        container.innerHTML = list.map(g => `
            <div class="group-item ${activeChat.id === g.id ? 'active' : ''}" data-id="${g.id}" data-type="group" data-name="${g.groupName}" data-group-id="${g.groupId}">
                <div class="group-avatar">${g.avatar}</div>
                <div class="group-info">
                    <div class="group-name">${g.groupName}</div>
                    <div class="group-meta">${g.members.length} 人</div>
                </div>
            </div>
        `).join('');
        document.querySelectorAll('.group-item').forEach(el => {
            el.addEventListener('click', () => {
                switchChat(el.dataset.id, el.dataset.type, el.dataset.name);
                if (window.innerWidth < 768) closeSidebar();
            });
        });
    }

    function renderMessages(msgs) {
        const container = document.getElementById('messagesContainer');
        if (!activeChat.id) { container.innerHTML = '<div class="empty-chat">聊天记录<br>点击左侧联系人</div>'; return; }
        if (!msgs.length) { container.innerHTML = '<div class="empty-chat">暂无消息</div>'; return; }
        const html = msgs.map(m => {
            const isOwn = m.from === currentUser.username;
            const time = new Date(m.timestamp).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
            const sender = activeChat.type === 'group' && !isOwn ? `<div style="font-size:11px;margin-bottom:4px;color:#7f8c8d">${m.fromNickname}</div>` : '';
            return `
                <div class="message-row ${isOwn ? 'own' : ''}">
                    <div class="message-bubble">
                        ${sender}
                        <div>${escapeHtml(m.content)}</div>
                        <div class="message-time">${time}</div>
                    </div>
                </div>
            `;
        }).join('');
        container.innerHTML = html;
        container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(s) {
        return s.replace(/[&<>]/g, function(c) {
            if (c === '&') return '&amp;';
            if (c === '<') return '&lt;';
            if (c === '>') return '&gt;';
            return c;
        });
    }

    async function switchChat(id, type, name) {
        activeChat = { id, type, name };
        document.getElementById('chatContactName').innerText = name;
        document.getElementById('chatContactType').innerText = type === 'friend' ? '私密好友' : '群聊';
        const btn = document.getElementById('addMemberBtn');
        if (type === 'group') {
            btn.style.display = 'block';
            const group = groupsData.find(g => g.id === id);
            if (group) btn.onclick = () => showAddMemberModal(group.groupId);
        } else {
            btn.style.display = 'none';
        }
        const msgs = await getMessagesForChat(id);
        renderMessages(msgs);
        renderFriendsList(friendsData);
        renderGroupsList(groupsData);
    }

    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const content = input.value.trim();
        if (!content || !activeChat.id) return;
        const ok = await sendMessageToChat(activeChat.id, activeChat.type, content);
        if (ok) input.value = '';
        else alert('发送失败');
    }

    function showAddFriendModal() {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content">
                <h4>添加好友</h4>
                <input type="text" id="friendName" placeholder="对方用户名">
                <button id="confirmBtn">确认</button>
                <button class="close" id="cancelBtn">取消</button>
            </div>
        `;
        document.body.appendChild(modal);
        document.getElementById('confirmBtn').onclick = async () => {
            const name = document.getElementById('friendName').value.trim();
            if (name) {
                if (await addFriend(name)) { alert('添加成功'); location.reload(); }
            } else alert('请输入用户名');
            modal.remove();
        };
        document.getElementById('cancelBtn').onclick = () => modal.remove();
    }

    function showCreateGroupModal() {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content">
                <h4>创建群聊</h4>
                <input type="text" id="groupName" placeholder="群名称">
                <button id="confirmBtn">确认</button>
                <button class="close" id="cancelBtn">取消</button>
            </div>
        `;
        document.body.appendChild(modal);
        document.getElementById('confirmBtn').onclick = async () => {
            const name = document.getElementById('groupName').value.trim();
            if (name) {
                if (await createGroup(name)) { alert('创建成功'); location.reload(); }
            } else alert('请输入群名');
            modal.remove();
        };
        document.getElementById('cancelBtn').onclick = () => modal.remove();
    }

    function showAddMemberModal(groupId) {
        const opts = friendsData.map(f => `<option value="${f.username}">${f.nickname}</option>`).join('');
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content">
                <h4>添加成员</h4>
                <select id="memberSelect"><option value="">请选择</option>${opts}</select>
                <button id="confirmBtn">确认</button>
                <button class="close" id="cancelBtn">取消</button>
            </div>
        `;
        document.body.appendChild(modal);
        document.getElementById('confirmBtn').onclick = async () => {
            const member = document.getElementById('memberSelect').value;
            if (member) {
                if (await addMemberToGroup(groupId, member)) { alert('添加成功'); location.reload(); }
            } else alert('请选择好友');
            modal.remove();
        };
        document.getElementById('cancelBtn').onclick = () => modal.remove();
    }

    function logout() {
        localStorage.removeItem('chatUser');
        location.reload();
    }

    async function initAfterLogin() {
        document.getElementById('currentUserName').innerText = currentUser.nickname;
        document.getElementById('currentUserAvatar').innerText = currentUser.avatar;
        friendsData = await loadFriends();
        groupsData = await loadGroups();
        renderFriendsList(friendsData);
        renderGroupsList(groupsData);
        document.getElementById('sendBtn').onclick = sendMessage;
        document.getElementById('messageInput').onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };
        document.getElementById('addFriendBtn').onclick = showAddFriendModal;
        document.getElementById('createGroupBtn').onclick = showCreateGroupModal;
        document.getElementById('logoutBtn').onclick = logout;
        if (pollInterval) clearInterval(pollInterval);
        pollInterval = setInterval(async () => {
            if (currentUser && activeChat.id) {
                const msgs = await getMessagesForChat(activeChat.id);
                renderMessages(msgs);
            }
        }, 2000);
    }

    function toggleForm() {
        isLoginMode = !isLoginMode;
        document.getElementById('formTitle').innerText = isLoginMode ? 'GitChat 登录' : 'GitChat 注册';
        document.getElementById('submitBtn').innerText = isLoginMode ? '登录' : '注册';
        document.getElementById('toggleFormBtn').innerText = isLoginMode ? '没有账号？去注册' : '已有账号？去登录';
        document.getElementById('formMessage').innerText = '';
    }

    async function handleSubmit() {
        const user = document.getElementById('loginUsername').value.trim();
        const pwd = document.getElementById('loginPassword').value;
        if (!user || !pwd) {
            document.getElementById('formMessage').innerText = '请输入用户名和密码';
            return;
        }
        if (isLoginMode) {
            if (await login(user, pwd)) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                await initAfterLogin();
            }
        } else {
            if (await register(user, pwd)) {
                isLoginMode = true;
                document.getElementById('formTitle').innerText = 'GitChat 登录';
                document.getElementById('submitBtn').innerText = '登录';
                document.getElementById('toggleFormBtn').innerText = '没有账号？去注册';
                document.getElementById('loginUsername').value = user;
                document.getElementById('loginPassword').value = '';
            }
        }
    }

    document.getElementById('menuToggle').addEventListener('click', openSidebar);
    document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);
    document.getElementById('submitBtn').onclick = handleSubmit;
    document.getElementById('toggleFormBtn').onclick = (e) => { e.preventDefault(); toggleForm(); };
    document.getElementById('loginPassword').onkeypress = (e) => { if (e.key === 'Enter') handleSubmit(); };

    const saved = localStorage.getItem('chatUser');
    if (saved) {
        currentUser = JSON.parse(saved);
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        initAfterLogin();
    }
</script>
</body>
</html>
