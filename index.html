// 播放语音
function playVoiceMessage(base64Data, duration) {
    // 确保 dataURL 格式正确
    let audioSrc = base64Data;
    
    // 如果不是以 data:audio 开头，尝试添加 MIME 头
    if (!base64Data.startsWith('data:audio')) {
        // 检测是否是纯 base64
        if (base64Data.match(/^[A-Za-z0-9+/=]+$/)) {
            audioSrc = 'data:audio/webm;base64,' + base64Data;
        } else if (base64Data.startsWith('data:application/octet-stream')) {
            audioSrc = base64Data.replace('data:application/octet-stream', 'data:audio/webm');
        }
    }
    
    const audio = new Audio(audioSrc);
    
    // 添加错误处理
    audio.onerror = (e) => {
        console.error('音频加载错误:', e);
        console.log('音频数据前100字符:', audioSrc.substring(0, 100));
        showToast('语音加载失败，格式可能不支持');
    };
    
    audio.play().catch(e => {
        console.error('播放失败:', e);
        showToast('语音播放失败');
    });
    
    showToast(`播放语音 ${duration}秒`);
}

// 初始化录音功能
function initVoiceRecording() {
    const voiceBtn = document.getElementById('voiceBtn');
    if (!voiceBtn) return;
    
    let longPressTimer = null;
    let startY = 0;
    let isCanceling = false;
    
    voiceBtn.addEventListener('mousedown', startRecording);
    voiceBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        startY = e.touches[0].clientY;
        startRecording(e);
    });
    
    voiceBtn.addEventListener('mouseup', stopRecording);
    voiceBtn.addEventListener('mouseleave', cancelRecording);
    voiceBtn.addEventListener('touchend', stopRecording);
    voiceBtn.addEventListener('touchmove', (e) => {
        const currentY = e.touches[0].clientY;
        if (startY - currentY > 50) {
            isCanceling = true;
            voiceBtn.style.background = '#95a5a6';
            showToast('上滑取消发送');
        } else {
            isCanceling = false;
            voiceBtn.style.background = '';
        }
    });
    
    async function startRecording(e) {
        if (!activeChat.id) {
            alert('请先选择聊天对象');
            return;
        }
        if (isRecording) return;
        
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
            audioChunks = [];
            recordingSeconds = 0;
            isRecording = true;
            
            mediaRecorder.ondataavailable = (event) => {
                audioChunks.push(event.data);
            };
            
            mediaRecorder.onstop = async () => {
                stream.getTracks().forEach(track => track.stop());
                
                if (!isCanceling && audioChunks.length > 0) {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    if (recordingSeconds >= 1) {
                        const result = await sendVoiceMessage(activeChat.id, activeChat.type, audioBlob);
                        if (!result.ok) {
                            showToast('语音发送失败');
                        }
                    } else {
                        showToast('录音时间太短');
                    }
                }
                
                cleanRecording();
            };
            
            mediaRecorder.start(100);
            startTimer();
            
            voiceBtn.classList.add('recording');
            showRecordingTimer();
            
            if (navigator.vibrate) navigator.vibrate(50);
        } catch (err) {
            console.error('录音失败', err);
            showToast('无法录音，请检查麦克风权限');
        }
    }
    
    function stopRecording() {
        if (!isRecording) return;
        if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
        }
        isCanceling = false;
        stopTimer();
        hideRecordingTimer();
        voiceBtn.classList.remove('recording');
        voiceBtn.style.background = '';
        isRecording = false;
    }
    
    function cancelRecording() {
        if (!isRecording) return;
        isCanceling = true;
        if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
        }
        stopTimer();
        hideRecordingTimer();
        voiceBtn.classList.remove('recording');
        voiceBtn.style.background = '';
        isRecording = false;
        showToast('已取消');
    }
    
    function startTimer() {
        recordingSeconds = 0;
        recordingTimer = setInterval(() => {
            recordingSeconds++;
            updateRecordingTimer();
            if (recordingSeconds >= 60) {
                stopRecording();
            }
        }, 1000);
    }
    
    function stopTimer() {
        if (recordingTimer) {
            clearInterval(recordingTimer);
            recordingTimer = null;
        }
    }
    
    function showRecordingTimer() {
        let timerDiv = document.getElementById('recordingTimer');
        if (!timerDiv) {
            timerDiv = document.createElement('div');
            timerDiv.id = 'recordingTimer';
            timerDiv.className = 'recording-timer';
            document.body.appendChild(timerDiv);
        }
        timerDiv.style.display = 'block';
        updateRecordingTimer();
    }
    
    function updateRecordingTimer() {
        const timerDiv = document.getElementById('recordingTimer');
        if (timerDiv) {
            timerDiv.textContent = `🎙 录音中 ${recordingSeconds}秒`;
        }
    }
    
    function hideRecordingTimer() {
        const timerDiv = document.getElementById('recordingTimer');
        if (timerDiv) {
            timerDiv.style.display = 'none';
        }
    }
    
    function cleanRecording() {
        audioChunks = [];
        recordingSeconds = 0;
        isCanceling = false;
    }
}

        groupId: groupId,
        targetUser: targetUser,
        inviter: inviter,

    });

        alert('群不存在');
        return false;
    }
    if (groups[idx].members.includes(member)) { 
        alert('已在群中');
        return false;
    }
    groups[idx].members.push(member);
    await writeGitHubFile('groups.json', groups, `添加成员 ${member} 到群`);
    return true;
}

// 禁言/取消禁言
async function toggleMuteMember(groupId, member) {
    const groups = await readGitHubFile('groups.json') || [];
    const idx = groups.findIndex(g => g.id === groupId);
    if (idx !== -1) {
        if (!groups[idx].settings) groups[idx].settings = { mutedMembers: [] };
        if (groups[idx].settings.mutedMembers.includes(member)) {
            groups[idx].settings.mutedMembers = groups[idx].settings.mutedMembers.filter(m => m !== member);
        } else {
            groups[idx].settings.mutedMembers.push(member);
        }
        await writeGitHubFile('groups.json', groups, `禁言/取消禁言: ${member}`);
    }
}

            async function pollMessages() {
                if (!currentUser) return;
                const all = await loadMessages();
                const relevant = new Set();
                friendsData.forEach(f => relevant.add(f.id));
                groupsData.forEach(g => relevant.add(g.id));
                if (currentUser.isAdmin) {
                    all.forEach(m => { if (m.targetId?.startsWith('chat_admin_')) relevant.add(m.targetId); });
                }
                // 更新送达状态
                for (const [clientMsgId, entry] of pendingMessages) {
                    if (entry.status === 'stored' || entry.status === 'pending') {
                        const found = all.find(m => m.clientMsgId === clientMsgId);
                        if (found) {
                            found.status = 'delivered';
                            entry.status = 'delivered';
                            pendingMessages.delete(clientMsgId);
                            // 持久化状态
                            try {
                                const allMsgs = await loadMessages();
                                const idx = allMsgs.findIndex(m => m.clientMsgId === clientMsgId);
                                if (idx !== -1) {
                                    allMsgs[idx].status = 'delivered';
                                    await saveMessages(allMsgs);
                                }
                            } catch (e) {}
                        }
                    }
                }
                // 清理超过60秒的pending消息
                const now = Date.now();
                for (const [clientMsgId, entry] of pendingMessages) {
                    if (now - entry.timestamp > 60000 && (entry.status === 'pending' || entry.status ===
                            'stored')) {
                        entry.status = 'delivered';
                        pendingMessages.delete(clientMsgId);
                    }
                }
                for (const cid of relevant) {
                    const msgs = all.filter(m => m.targetId === cid && !localDeletedIds.includes(m.id));
                    if (!msgs.length) continue;
                    const latest = Math.max(...msgs.map(m => m.timestamp));
                    const seen = lastSeenTimestamps[cid] || 0;
                    if (latest > seen) {
                        const newCnt = msgs.filter(m => m.timestamp > seen && m.from !== currentUser
                            .username).length;
                        if (cid !== activeChat.id) {
                            unreadCounts[cid] = (unreadCounts[cid] || 0) + newCnt;
                            saveUnread();
                            if (newCnt > 0) playNotificationSound();
                        } else {
                            lastSeenTimestamps[cid] = latest;
                            saveLastSeen();
                            unreadCounts[cid] = 0;
                        }
                    }
                }

    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const size = 200;
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                
                let sx = 0, sy = 0, sw = img.width, sh = img.height;
                if (img.width > img.height) {
                    sx = (img.width - img.height) / 2;
                    sw = img.height;
                } else {
                    sy = (img.height - img.width) / 2;
                    sh = img.width;
                }
                
                ctx.drawImage(img, sx, sy, sw, sh, 0, 0, size, size);
                canvas.toBlob(resolve, 'image/jpeg', 0.8);
            };
            img.onerror = reject;
            img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

// 辅助函数：上传头像到 GitHub
async function uploadAvatarForAdmin(username, blob) {
    const token = await getGitHubToken();
    const timestamp = Date.now();
    const filename = `${username}_${timestamp}.jpg`;
    const path = `avatars/${filename}`;
    
    const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
    });
    
    // 确保 avatars 文件夹存在
    const folderUrl = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/avatars?ref=${GITHUB_CONFIG.branch}`;
    const folderRes = await fetch(folderUrl, { headers: { Authorization: `token ${token}` } });
    if (folderRes.status === 404) {
        await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/avatars/.gitkeep`, {
            method: 'PUT',
            headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: '创建 avatars 文件夹', content: '', branch: GITHUB_CONFIG.branch })
        });
    }
    
    // 上传头像
    const uploadUrl = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${path}`;
    await fetch(uploadUrl, {
        method: 'PUT',
        headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: `上传头像: ${username}`, content: base64, branch: GITHUB_CONFIG.branch })
    });
    
    // 删除旧头像
    const users = await readGitHubFile('users.json') || {};
    const oldAvatar = users[username]?.avatar;
    if (oldAvatar && oldAvatar.startsWith('avatars/')) {
        try {
            const deleteUrl = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${oldAvatar}`;
            const oldFileRes = await fetch(deleteUrl, { headers: { Authorization: `token ${token}` } });
            if (oldFileRes.ok) {
                const oldData = await oldFileRes.json();
                await fetch(deleteUrl, {
                    method: 'DELETE',
                    headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `删除旧头像`, sha: oldData.sha, branch: GITHUB_CONFIG.branch })
                });
            }
        } catch(e) {}
    }
    
    return {
        url: `https://raw.githubusercontent.com/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/${GITHUB_CONFIG.branch}/${path}`,
        path: path
    };
}

    }
}

            document.getElementById('submitBtn').onclick = handleSubmit;
            document.getElementById('toggleFormBtn').onclick = (e) => {
                e.preventDefault();
                isLoginMode = !isLoginMode;
                document.getElementById('formTitle').innerText = isLoginMode ? 'GitChat 登录' : 'GitChat 注册';
                document.getElementById('submitBtn').innerText = isLoginMode ? '登录' : '注册';
                document.getElementById('toggleFormBtn').innerText = isLoginMode ? '没有账号？去注册' :
                    '已有账号？去登录';
                document.getElementById('formMessage').innerText = '';
                document.getElementById('formMessage').className = 'error';
            };
            document.getElementById('loginPassword').onkeypress = (e) => { if (e.key === 'Enter') handleSubmit(); };

            window.addEventListener('beforeunload', () => { saveUnread();
                saveLastSeen(); });
        })();
    </script>
