            // ========== 全屏图片预览 ==========
            function showImagePreview(fullSrc) {
                // 移除已有预览
                const existing = document.querySelector('.image-preview-overlay');
                if (existing) existing.remove();

                const overlay = document.createElement('div');
                overlay.className = 'image-preview-overlay';
                overlay.innerHTML = `
                    <button class="image-preview-close" title="关闭">✕</button>
                    <img src="${fullSrc}" class="image-preview-img" alt="预览图片" loading="eager">
                `;
                const closePreview = () => overlay.remove();
                overlay.addEventListener('click', function(e) {
                    if (e.target === overlay || e.target.classList.contains('image-preview-close')) {
                        closePreview();
                    }
                });
                // ESC 键关闭
                const escHandler = (e) => {
                    if (e.key === 'Escape') { closePreview();
                        document.removeEventListener('keydown', escHandler); }
                };
                document.addEventListener('keydown', escHandler);
                overlay._escHandler = escHandler;
                // 移除时清理
                const origRemove = overlay.remove.bind(overlay);
                overlay.remove = function() {
                    document.removeEventListener('keydown', overlay._escHandler);
                    origRemove();
                };
                document.body.appendChild(overlay);
            }

            // ========== UI 渲染 ==========
            function updateUnreadBadges() {
                document.querySelectorAll('.contact-item, .group-item').forEach(el => {
                    const chatId = el.dataset.id;
                    const badge = el.querySelector('.unread-badge');
                    const count = unreadCounts[chatId] || 0;
                    if (count > 0) {
                        if (!badge) {
                            const av = el.querySelector('.contact-avatar, .group-avatar');
                            if (av) {
                                const span = document.createElement('span');
                                span.className = 'unread-badge';
                                span.textContent = count > 99 ? '99+' : count;
                                av.appendChild(span);
                            }
                        } else {
                            badge.textContent = count > 99 ? '99+' : count;
                        }
                    } else {
                        if (badge) badge.remove();
                    }
                });
            }

            function renderFriendsList(friends) {
                const container = document.getElementById('friendsList');
                if (!friends.length) {
                    container.innerHTML =
                        '<div style="padding:12px 20px;color:#95a5a6;font-size:13px;">暂无好友</div>';
                    return;
                }
                container.innerHTML = friends.map(f => `
                    <div class="contact-item ${activeChat.id === f.id ? 'active' : ''}" data-id="${f.id}" data-type="friend" data-name="${f.nickname}">
                        <div class="contact-avatar">${f.avatar}</div>
                        <div class="contact-info">
                            <div class="contact-name">${f.nickname}</div>
                            <div class="contact-meta">@${f.username}</div>
                        </div>
                    </div>`).join('');
                container.querySelectorAll('.contact-item').forEach(el => {
                    el.addEventListener('click', () => switchChat(el.dataset.id, 'friend', el.dataset.name));
                });
                updateUnreadBadges();
            }

            function renderGroupsList(groups) {
                const container = document.getElementById('groupsList');
                if (!groups.length) {
                    container.innerHTML =
                        '<div style="padding:12px 20px;color:#95a5a6;font-size:13px;">暂无群聊</div>';
                    return;
                }
                container.innerHTML = groups.map(g => `
                    <div class="group-item ${activeChat.id === g.id ? 'active' : ''}" data-id="${g.id}" data-type="group" data-name="${g.groupName}">
                        <div class="group-avatar">${g.avatar}</div>
                        <div class="group-info">
                            <div class="group-name">${g.groupName}</div>
                            <div class="group-meta">${g.members.length} 人 · 群聊</div>
                        </div>
                    </div>`).join('');
                container.querySelectorAll('.group-item').forEach(el => {
                    el.addEventListener('click', () => switchChat(el.dataset.id, 'group', el.dataset.name));
                });
                updateUnreadBadges();
            }

            function renderMessages(msgs) {
                const container = document.getElementById('messagesContainer');
                if (!activeChat.id) {
                    container.innerHTML =
                        '<div class="empty-chat"><span>聊天记录</span><span>点击左侧联系人开始聊天</span></div>';
                    return;
                }
                if (!msgs.length) {
                    container.innerHTML = '<div class="empty-chat"><span>暂无消息</span><span>发一条消息吧</span></div>';
                    return;
                }
                container.innerHTML = msgs.map(m => {
                    const isOwn = m.from === currentUser.username;
                    const time = new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit',
                        minute: '2-digit' });
                    const isAdminMsg = m.from === 'admin';
                    let bubbleClass = '';
                    let senderLabel = '';
                    if (isAdminMsg && (activeChat.type === 'group' || activeChat.id.startsWith(
                            'chat_admin_'))) {
                        bubbleClass = ' admin-msg';
                        senderLabel =
                            '<div class="admin-sender-label" style="font-size:11px;margin-bottom:4px;">管理员</div>';
                    } else if (activeChat.type === 'group' && !isOwn) {
                        senderLabel =
                            `<div style="font-size:11px;color:#7f8c8d;margin-bottom:4px;">${escapeHtml(m.fromNickname || m.from)}</div>`;
                    }
                    // 判断是否为图片消息
                    if (m.type === 'image') {
                        const thumbSrc = m.thumbnail || m.content;
                        const fullSrc = m.content;
                        const imgHtml = `
                            <img src="${thumbSrc}" 
                                 class="msg-image" 
                                 data-full="${fullSrc}"
                                 alt="图片"
                                 loading="lazy"
                                 onclick="event.stopPropagation();window._showImagePreview && window._showImagePreview(this.dataset.full);"
                                 onerror="this.outerHTML='<span class=\\'msg-image-placeholder\\'>🖼️</span>'">
                        `;
                        return `<div class="message-row ${isOwn ? 'own' : ''}">
                            <div class="message-bubble image-bubble${bubbleClass}">
                                ${senderLabel}
                                ${imgHtml}
                                <div class="message-time">${time}</div>
                            </div>
                        </div>`;
                    }
                    // 文字消息
                    return `<div class="message-row ${isOwn ? 'own' : ''}">
                        <div class="message-bubble${bubbleClass}">
                            ${senderLabel}
                            <div>${escapeHtml(m.content)}</div>
                            <div class="message-time">${time}</div>
                        </div>
                    </div>`;
                }).join('');
                container.scrollTop = container.scrollHeight;
            }

            function escapeHtml(s) {
                if (!s || typeof s !== 'string') return '';
                return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
            }

            async function switchChat(chatId, type, name) {
                activeChat = { id: chatId, type, name };
                document.getElementById('chatContactName').innerText = name;
                document.getElementById('chatContactType').innerText = type === 'friend' ? '私密好友' : '群聊';
                document.getElementById('addMemberBtn').style.display = type === 'group' ? 'block' : 'none';
                if (type === 'group') {
                    const g = groupsData.find(x => x.id === chatId);
                    if (g) document.getElementById('addMemberBtn').onclick = () => showAddMemberModal(g.groupId);
                }
                unreadCounts[chatId] = 0;
                saveUnread();
                const msgs = await getMessagesForChat(chatId);
                if (msgs.length) lastSeenTimestamps[chatId] = Math.max(...msgs.map(m => m.timestamp));
                else lastSeenTimestamps[chatId] = Date.now();
                saveLastSeen();
                renderMessages(msgs);
                renderFriendsList(friendsData);
                renderGroupsList(groupsData);
                bindSendEvents();
            }

            function bindSendEvents() {
                const sendBtn = document.getElementById('sendBtn');
                const input = document.getElementById('messageInput');
                sendBtn.onclick = sendMessage;
                input.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };
            }

            async function sendMessage() {
                const input = document.getElementById('messageInput');
                const content = input.value.trim();
                if (!content || !activeChat.id) return;
                const ok = await sendMessageToChat(activeChat.id, activeChat.type, content);
                if (ok) input.value = '';
                else alert('发送失败');
            }

            // ========== 图片事件绑定 ==========
            function bindImageEvents() {
                if (imageEventsBound) return;
                imageEventsBound = true;

                // 将 showImagePreview 暴露到全局，供内联 onclick 使用
                window._showImagePreview = showImagePreview;

                // 相机按钮点击
                const imageBtn = document.getElementById('imageBtn');
                const imageFileInput = document.getElementById('imageFileInput');
                if (imageBtn && imageFileInput) {
                    imageBtn.addEventListener('click', () => {
                        if (!activeChat.id) {
                            alert('请先选择聊天对象');
                            return;
                        }
                        imageFileInput.value = '';
                        imageFileInput.click();
                    });
                    imageFileInput.addEventListener('change', () => {
                        const file = imageFileInput.files[0];
                        if (file) {
                            handleImageSend(file);
                            imageFileInput.value = '';
                        }
                    });
                }

                // Ctrl+V 粘贴图片
                document.addEventListener('paste', async (e) => {
                    if (!activeChat.id) return;
                    const items = e.clipboardData?.items;
                    if (!items) return;
                    for (const item of items) {
                        if (item.type.startsWith('image/')) {
                            e.preventDefault();
                            const file = item.getAsFile();
                            if (file) {
                                await handleImageSend(file);
                            }
                            return;
                        }
                    }
                });

                // 拖拽图片到聊天区域
                const messagesContainer = document.getElementById('messagesContainer');
                const chatArea = document.getElementById('chatArea');

                function setupDragDrop(el) {
                    if (!el) return;
                    el.addEventListener('dragover', (e) => {
                        if (!activeChat.id) return;
                        const hasImage = Array.from(e.dataTransfer.types).some(t => t ===
                            'Files' || t === 'file');
                        if (hasImage) {
                            e.preventDefault();
                            e.stopPropagation();
                            e.dataTransfer.dropEffect = 'copy';
                            messagesContainer.classList.add('drag-over');
                        }
                    });
                    el.addEventListener('dragleave', (e) => {
                        if (e.target === el || e.target === messagesContainer) {
                            messagesContainer.classList.remove('drag-over');
                        }
                    });
                    el.addEventListener('drop', async (e) => {
                        messagesContainer.classList.remove('drag-over');
                        if (!activeChat.id) return;
                        const files = e.dataTransfer?.files;
                        if (files && files.length > 0) {
                            const file = files[0];
                            if (file.type.startsWith('image/')) {
                                e.preventDefault();
                                e.stopPropagation();
                                await handleImageSend(file);
                            }
                        }
                    });
                }
                setupDragDrop(messagesContainer);
                setupDragDrop(chatArea);
            }

            // 弹窗
            function showAddFriendModal() {
                const modal = document.createElement('div');
                modal.className = 'modal';
                modal.innerHTML = `
                    <div class="modal-content">
                        <h4>添加好友</h4>
                        <input type="text" id="friendUsername" placeholder="对方用户名">
                        <button id="confirmAddFriend">确认</button>
                        <button class="close" id="closeModal">取消</button>
                    </div>`;
                document.body.appendChild(modal);
                document.getElementById('confirmAddFriend').onclick = async () => {
                    const name = document.getElementById('friendUsername').value.trim();
                    if (name) { await addFriend(name);
                        location.reload(); } else alert('请输入用户名');
                    modal.remove();
                };
                document.getElementById('closeModal').onclick = () => modal.remove();
            }

            function showCreateGroupModal() {
                const modal = document.createElement('div');
                modal.className = 'modal';
                modal.innerHTML = `
                    <div class="modal-content">
                        <h4>创建群聊</h4>
                        <input type="text" id="groupName" placeholder="群名称">
                        <button id="confirmCreateGroup">创建</button>
                        <button class="close" id="closeModal">取消</button>
                    </div>`;
                document.body.appendChild(modal);
                document.getElementById('confirmCreateGroup').onclick = async () => {
                    const name = document.getElementById('groupName').value.trim();
                    if (name) { await createGroup(name);
                        location.reload(); } else alert('请输入名称');
                    modal.remove();
                };
                document.getElementById('closeModal').onclick = () => modal.remove();
            }

            function showAddMemberModal(groupId) {
                const opts = friendsData.map(f => `<option value="${f.username}">${f.nickname}</option>`).join('');
                const modal = document.createElement('div');
                modal.className = 'modal';
                modal.innerHTML = `
                    <div class="modal-content">
                        <h4>添加成员</h4>
                        <select id="memberSelect"><option value="">选择好友</option>${opts}</select>
                        <button id="confirmAddMember">添加</button>
                        <button class="close" id="closeModal">取消</button>
                    </div>`;
                document.body.appendChild(modal);
                document.getElementById('confirmAddMember').onclick = async () => {
                    const member = document.getElementById('memberSelect').value;
                    if (member) { await addMemberToGroup(groupId, member);
                        location.reload(); } else alert('请选择好友');
                    modal.remove();
                };
                document.getElementById('closeModal').onclick = () => modal.remove();
            }

            function logout() { localStorage.removeItem('chatUser');
                location.reload(); }

            // 未读存储
            function saveUnread() { localStorage.setItem(`unread_${currentUser.username}`, JSON.stringify(
                unreadCounts)); }

            function loadUnread() {
                const s = localStorage.getItem(`unread_${currentUser.username}`);
                if (s) try { unreadCounts = JSON.parse(s); } catch (e) {}
            }

            function saveLastSeen() { localStorage.setItem(`lastSeen_${currentUser.username}`, JSON.stringify(
                lastSeenTimestamps)); }

            function loadLastSeen() {
                const s = localStorage.getItem(`lastSeen_${currentUser.username}`);
                if (s) try { lastSeenTimestamps = JSON.parse(s); } catch (e) {}
            }

            async function pollMessages() {
                if (!currentUser) return;
                const all = await loadMessages();
                const relevant = new Set();
                friendsData.forEach(f => relevant.add(f.id));
                groupsData.forEach(g => relevant.add(g.id));
                if (currentUser.isAdmin) {
                    all.forEach(m => { if (m.targetId?.startsWith('chat_admin_')) relevant.add(m.targetId); });
                }
                for (const cid of relevant) {
                    const msgs = all.filter(m => m.targetId === cid);
                    if (!msgs.length) continue;
                    const latest = Math.max(...msgs.map(m => m.timestamp));
                    const seen = lastSeenTimestamps[cid] || 0;
                    if (latest > seen) {
                        const newCnt = msgs.filter(m => m.timestamp > seen).length;
                        if (cid !== activeChat.id) {
                            unreadCounts[cid] = (unreadCounts[cid] || 0) + newCnt;
                            saveUnread();
                            if (newCnt > 0) playNotificationSound();
                        } else {
                            lastSeenTimestamps[cid] = latest;
                            saveLastSeen();
                            unreadCounts[cid] = 0;
                        }
                    }
                }
                updateUnreadBadges();
                if (activeChat.id) {
                    renderMessages(await getMessagesForChat(activeChat.id));
                }
            }

            // ========== 管理员后台 ==========
            async function initAdminPanel() {
                document.getElementById('sidebar').style.display = 'none';
                document.getElementById('chatArea').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'flex';
                document.getElementById('adminLogoutBtn').onclick = logout;
                document.querySelectorAll('.admin-tab').forEach(t => {
                    t.addEventListener('click', () => {
                        document.querySelectorAll('.admin-tab').forEach(x => x.classList.remove(
                            'active'));
                        t.classList.add('active');
                        t.dataset.tab === 'users' ? renderAdminUsers() : renderAdminGroups();
                    });
                });
                renderAdminUsers();
                // 确保图片事件绑定
                bindImageEvents();
            }

            async function renderAdminUsers() {
                const content = document.getElementById('adminContent');
                content.innerHTML = '<p>加载中...</p>';
                const users = await readGitHubFile('users.json') || {};
                const list = Object.keys(users).filter(u => u !== ADMIN_CREDENTIALS.username);
                let html = `
                    <div class="admin-input-group">
                        <input id="newUsername" placeholder="新用户名"><input type="password" id="newPassword" placeholder="密码">
                        <button class="admin-btn" id="createUserBtn">创建用户</button>
                    </div>
                    <table class="admin-table"><thead><tr><th>用户名</th><th>昵称</th><th>操作</th></tr></thead><tbody>`;
                for (const u of list) {
                    html += `<tr>
                        <td>${u}</td><td>${users[u].nickname||u}</td>
                        <td>
                            <button class="admin-btn chat-user-btn" data-username="${u}">聊天</button>
                            <button class="admin-btn warning reset-pwd-btn" data-username="${u}">重置密码</button>
                            <button class="admin-btn change-nick-btn" data-username="${u}">改昵称</button>
                            <button class="admin-btn change-pwd-btn" data-username="${u}">改密码</button>
                            <button class="admin-btn danger delete-user-btn" data-username="${u}">删除</button>
                            <button class="admin-btn manage-friends-btn" data-username="${u}">好友管理</button>
                        </td>
                    </tr>`;
                }
                html += '</tbody></table>';
                content.innerHTML = html;

                document.getElementById('createUserBtn').onclick = async () => {
                    const name = document.getElementById('newUsername').value.trim();
                    const pwd = document.getElementById('newPassword').value;
                    if (!name || !pwd) return alert('请输入用户名和密码');
                    const u = await readGitHubFile('users.json') || {};
                    if (u[name]) return alert('已存在');
                    u[name] = { password: pwd, nickname: name };
                    await writeGitHubFile('users.json', u, '管理员创建用户');
                    alert('创建成功');
                    renderAdminUsers();
                };
                document.querySelectorAll('.delete-user-btn').forEach(b => b.onclick = async () => {
                    const uname = b.dataset.username;
                    if (!confirm(`确定删除用户 ${uname} ？`)) return;
                    const u = await readGitHubFile('users.json') || {};
                    delete u[uname];
                    await writeGitHubFile('users.json', u, `删除用户 ${uname}`);
                    let fs = await readGitHubFile('friendships.json') || [];
                    fs = fs.filter(f => f.user1 !== uname && f.user2 !== uname);
                    await writeGitHubFile('friendships.json', fs, `清理好友关系`);
                    let groups = await readGitHubFile('groups.json') || [];
                    groups.forEach(g => g.members = g.members.filter(m => m !== uname));
                    groups = groups.filter(g => g.members.length > 0);
                    await writeGitHubFile('groups.json', groups, `清理群成员`);
                    const msgs = await loadMessages();
                    const toDel = new Set();
                    msgs.forEach(m => { if (m.targetId?.startsWith('chat_') && m.targetId.includes(uname)) toDel.add(
                            m.targetId); });
                    for (const cid of toDel) await deleteMessagesByChatId(cid);
                    alert('已删除');
                    renderAdminUsers();
                });
                document.querySelectorAll('.reset-pwd-btn').forEach(b => b.onclick = async () => {
                    const uname = b.dataset.username;
                    const u = await readGitHubFile('users.json') || {};
                    if (u[uname]) { u[uname].password = '123456';
                        await writeGitHubFile('users.json', u, `重置密码 ${uname}`);
                        alert('密码已重置为123456'); }
                });
                document.querySelectorAll('.change-pwd-btn').forEach(b => b.onclick = async () => {
                    const uname = b.dataset.username;
                    const newPwd = prompt('新密码');
                    if (!newPwd) return;
                    const u = await readGitHubFile('users.json') || {};
                    if (u[uname]) { u[uname].password = newPwd;
                        await writeGitHubFile('users.json', u, `修改密码 ${uname}`);
                        alert('已修改'); }
                });
                document.querySelectorAll('.change-nick-btn').forEach(b => b.onclick = async () => {
                    const uname = b.dataset.username;
                    const nick = prompt('新昵称');
                    if (!nick) return;
                    const u = await readGitHubFile('users.json') || {};
                    if (u[uname]) { u[uname].nickname = nick;
                        await writeGitHubFile('users.json', u, `修改昵称 ${uname}`);
                        alert('已修改');
                        renderAdminUsers(); }
                });
                document.querySelectorAll('.chat-user-btn').forEach(b => b.onclick = () => startAdminChat(b.dataset
                    .username));
                document.querySelectorAll('.manage-friends-btn').forEach(b => b.onclick = () => showAdminFriendManager(
                    b.dataset.username));
            }

            async function startAdminChat(target) {
                const chatId = `chat_admin_${target}`;
                activeChat = { id: chatId, type: 'friend', name: target };
                document.getElementById('adminPanel').style.display = 'none';
                document.getElementById('sidebar').style.display = 'none';
                document.getElementById('chatArea').style.display = 'flex';
                document.getElementById('backToAdminBtn').style.display = 'inline-block';
                document.getElementById('addMemberBtn').style.display = 'none';
                document.getElementById('chatContactName').innerText = target;
                document.getElementById('chatContactType').innerText = '私聊 (管理员)';
                const msgs = await getMessagesForChat(chatId);
                if (msgs.length) lastSeenTimestamps[chatId] = Math.max(...msgs.map(m => m.timestamp));
                else lastSeenTimestamps[chatId] = Date.now();
                saveLastSeen();
                unreadCounts[chatId] = 0;
                saveUnread();
                renderMessages(msgs);
                bindSendEvents();
                bindImageEvents();
            }

            document.getElementById('backToAdminBtn').addEventListener('click', async () => {
                document.getElementById('chatArea').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'flex';
                document.getElementById('backToAdminBtn').style.display = 'none';
                activeChat = { id: null, type: null, name: null };
                renderAdminUsers();
            });

            async function showAdminFriendManager(uname) {
                const fs = await readGitHubFile('friendships.json') || [];
                const users = await readGitHubFile('users.json') || {};
                const friends = [];
                fs.forEach(f => {
                    if (f.user1 === uname && f.user2 !== ADMIN_CREDENTIALS.username) friends.push(f.user2);
                    if (f.user2 === uname && f.user1 !== ADMIN_CREDENTIALS.username) friends.push(f.user1);
                });
                const modal = document.createElement('div');
                modal.className = 'modal';
                modal.innerHTML = `
                    <div class="modal-content">
                        <h4>${uname} 的好友</h4>
                        <ul style="max-height:200px;overflow-y:auto;list-style:none;padding:0;">
                            ${friends.map(f => `<li style="display:flex;justify-content:space-between;padding:6px 0;"><span>${f} (${users[f]?.nickname||f})</span><button class="admin-btn danger remove-friend-btn" data-u1="${uname}" data-u2="${f}">解除</button></li>`).join('')}
                        </ul>
                        <hr>
                        <div class="admin-input-group"><input id="newFriendInput" placeholder="用户名"><button class="admin-btn" id="addFriendForUserBtn">添加好友</button></div>
                        <button class="close" id="closeModal">关闭</button>
                    </div>`;
                document.body.appendChild(modal);
                document.getElementById('closeModal').onclick = () => modal.remove();
                document.getElementById('addFriendForUserBtn').onclick = async () => {
                    const target = document.getElementById('newFriendInput').value.trim();
                    if (!target || target === ADMIN_CREDENTIALS.username) return alert('无效');
                    const u = await readGitHubFile('users.json') || {};
                    if (!u[target]) return alert('不存在');
                    let allFs = await readGitHubFile('friendships.json') || [];
                    if (allFs.some(f => (f.user1 === uname && f.user2 === target) || (f.user1 === target && f.user2 ===
                            uname))) return alert('已是好友');
                    allFs.push({ user1: uname, user2: target });
                    await writeGitHubFile('friendships.json', allFs, `管理员添加好友`);
                    alert('已添加');
                    modal.remove();
                    showAdminFriendManager(uname);
                };
                modal.querySelectorAll('.remove-friend-btn').forEach(b => b.onclick = async () => {
                    const u1 = b.dataset.u1,
                        u2 = b.dataset.u2;
                    let allFs = await readGitHubFile('friendships.json') || [];
                    allFs = allFs.filter(f => !((f.user1 === u1 && f.user2 === u2) || (f.user1 === u2 && f.user2 ===
                        u1)));
                    await writeGitHubFile('friendships.json', allFs, `解除好友`);
                    alert('已解除');
                    modal.remove();
                    showAdminFriendManager(uname);
                });
            }

            async function renderAdminGroups() {
                const content = document.getElementById('adminContent');
                content.innerHTML = '<p>加载中...</p>';
                const groups = await readGitHubFile('groups.json') || [];
                let html = `
                    <div class="admin-input-group"><input id="newGroupName" placeholder="群名称"><button class="admin-btn" id="createGroupAdminBtn">创建群聊</button></div>
                    <table class="admin-table"><thead><tr><th>ID</th><th>名称</th><th>群主</th><th>成员</th><th>操作</th></tr></thead><tbody>`;
                for (const g of groups) {
                    html += `<tr>
                        <td>${g.id}</td><td>${g.groupName}</td><td>${g.owner||g.members[0]}</td><td>${g.members.length}</td>
                        <td>
                            <button class="admin-btn view-members-btn" data-gid="${g.id}">成员</button>
                            <button class="admin-btn change-name-btn" data-gid="${g.id}">改名</button>
                            <button class="admin-btn warning transfer-btn" data-gid="${g.id}">转让</button>
                            <button class="admin-btn danger delete-group-btn" data-gid="${g.id}">删除</button>
                        </td>
                    </tr>`;
                }
                html += '</tbody></table>';
                content.innerHTML = html;

                document.getElementById('createGroupAdminBtn').onclick = async () => {
                    const name = document.getElementById('newGroupName').value.trim();
                    if (!name) return alert('输入名称');
                    const gs = await readGitHubFile('groups.json') || [];
                    gs.push({ id: Date.now().toString(), groupName: name, members: [ADMIN_CREDENTIALS.username],
                        owner: ADMIN_CREDENTIALS.username });
                    await writeGitHubFile('groups.json', gs, '管理员创建群');
                    alert('已创建');
                    renderAdminGroups();
                };
                document.querySelectorAll('.delete-group-btn').forEach(b => b.onclick = async () => {
                    const gid = b.dataset.gid;
                    if (!confirm('删除群聊及消息？')) return;
                    let gs = await readGitHubFile('groups.json') || [];
                    gs = gs.filter(g => g.id !== gid);
                    await writeGitHubFile('groups.json', gs, `删除群 ${gid}`);
                    await deleteMessagesByChatId(`group_${gid}`);
                    alert('已删除');
                    renderAdminGroups();
                });
                document.querySelectorAll('.change-name-btn').forEach(b => b.onclick = async () => {
                    const gid = b.dataset.gid;
                    const newName = prompt('新名称');
                    if (!newName) return;
                    let gs = await readGitHubFile('groups.json') || [];
                    const idx = gs.findIndex(g => g.id === gid);
                    if (idx !== -1) { gs[idx].groupName = newName;
                        await writeGitHubFile('groups.json', gs, `改名 ${gid}`); alert('已修改');
                        renderAdminGroups(); }
                });
                document.querySelectorAll('.view-members-btn').forEach(b => b.onclick = async () => {
                    const gid = b.dataset.gid;
                    const gs = await readGitHubFile('groups.json') || [];
                    const group = gs.find(g => g.id === gid);
                    if (!group) return;
                    const modal = document.createElement('div');
                    modal.className = 'modal';
                    modal.innerHTML = `
                        <div class="modal-content">
                            <h4>${group.groupName} 成员</h4>
                            <ul style="max-height:200px;overflow-y:auto;list-style:none;padding:0;">
                                ${group.members.map(m => `<li style="display:flex;justify-content:space-between;padding:4px 0;"><span>${m} ${m===group.owner?'(群主)':''}</span>${m!==ADMIN_CREDENTIALS.username?`<button class="admin-btn danger remove-member-btn" data-gid="${gid}" data-member="${m}">移除</button>`:''}</li>`).join('')}
                            </ul>
                            <hr>
                            <div class="admin-input-group"><input id="addMemberInput" placeholder="用户名"><button class="admin-btn" id="addMemberAdminBtn">强制加入</button></div>
                            <button class="close" id="closeModal">关闭</button>
                        </div>`;
                    document.body.appendChild(modal);
                    document.getElementById('closeModal').onclick = () => modal.remove();
                    document.getElementById('addMemberAdminBtn').onclick = async () => {
                        const m = document.getElementById('addMemberInput').value.trim();
                        if (!m || m === ADMIN_CREDENTIALS.username) return alert('无效');
                        const u = await readGitHubFile('users.json') || {};
                        if (!u[m]) return alert('不存在');
                        let gs2 = await readGitHubFile('groups.json') || [];
                        const idx = gs2.findIndex(g => g.id === gid);
                        if (idx !== -1) {
                            if (gs2[idx].members.includes(m)) return alert('已在群中');
                            gs2[idx].members.push(m);
                            await writeGitHubFile('groups.json', gs2, `强制加入 ${m}`);
                            alert('已添加');
                            modal.remove();
                            renderAdminGroups();
                        }
                    };
                    modal.querySelectorAll('.remove-member-btn').forEach(rb => rb.onclick = async () => {
                        const member = rb.dataset.member;
                        let gs2 = await readGitHubFile('groups.json') || [];
                        const idx = gs2.findIndex(g => g.id === gid);
                        if (idx !== -1) {
                            gs2[idx].members = gs2[idx].members.filter(x => x !== member);
                            await writeGitHubFile('groups.json', gs2, `移除 ${member}`);
                            alert('已移除');
                            modal.remove();
                            renderAdminGroups();
                        }
                    });
                });
                document.querySelectorAll('.transfer-btn').forEach(b => b.onclick = async () => {
                    const gid = b.dataset.gid;
                    const gs = await readGitHubFile('groups.json') || [];
                    const group = gs.find(g => g.id === gid);
                    if (!group) return;
                    const newOwner = prompt('输入新群主用户名（必须为群成员）');
                    if (!newOwner || !group.members.includes(newOwner)) return alert('无效');
                    group.owner = newOwner;
                    await writeGitHubFile('groups.json', gs, `转让群主 ${gid}`);
                    alert('已转让');
                    renderAdminGroups();
                });
            }

            // ========== 初始化入口 ==========
            async function initAfterLogin() {
                document.getElementById('currentUserName').innerText = currentUser.nickname;
                document.getElementById('currentUserAvatar').innerText = currentUser.avatar;
                loadUnread();
                loadLastSeen();
                friendsData = await loadFriends();
                groupsData = await loadGroups();
                renderFriendsList(friendsData);
                renderGroupsList(groupsData);
                bindSendEvents();
                bindImageEvents();
                document.getElementById('addFriendBtn').onclick = showAddFriendModal;
                document.getElementById('createGroupBtn').onclick = showCreateGroupModal;
                document.getElementById('logoutBtn').onclick = logout;
                if (pollInterval) clearInterval(pollInterval);
                pollInterval = setInterval(pollMessages, 2000);
            }

            async function handleSubmit() {
                const username = document.getElementById('loginUsername').value.trim();
                const password = document.getElementById('loginPassword').value;
                if (!username || !password) {
                    document.getElementById('formMessage').innerText = '请输入用户名和密码';
                    return;
                }
                if (isLoginMode) {
                    const ok = await login(username, password);
                    if (ok) {
                        document.getElementById('loginOverlay').style.display = 'none';
                        document.getElementById('app').style.display = 'flex';
                        if (currentUser.isAdmin) {
                            await initAdminPanel();
                        } else {
                            document.getElementById('adminPanel').style.display = 'none';
                            document.getElementById('sidebar').style.display = 'flex';
                            document.getElementById('chatArea').style.display = 'flex';
                            await initAfterLogin();
                        }
                    }
                } else {
                    const ok = await register(username, password);
                    if (ok) {
                        isLoginMode = true;
                        document.getElementById('formTitle').innerText = 'GitChat 登录';
                        document.getElementById('submitBtn').innerText = '登录';
                        document.getElementById('toggleFormBtn').innerText = '没有账号？去注册';
                        document.getElementById('loginUsername').value = username;
                        document.getElementById('loginPassword').value = '';
                    }
                }
            }

            // 音频首次激活
            document.addEventListener('click', () => {
                if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                tryResumeAudio();
            }, { once: true });

            const saved = localStorage.getItem('chatUser');
            if (saved) {
                currentUser = JSON.parse(saved);
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                if (currentUser.isAdmin) {
                    document.getElementById('sidebar').style.display = 'none';
                    document.getElementById('chatArea').style.display = 'none';
                    initAdminPanel();
                } else {
                    document.getElementById('adminPanel').style.display = 'none';
                    initAfterLogin();
                }
            }

            document.getElementById('submitBtn').onclick = handleSubmit;
            document.getElementById('toggleFormBtn').onclick = (e) => {
                e.preventDefault();
                isLoginMode = !isLoginMode;
                document.getElementById('formTitle').innerText = isLoginMode ? 'GitChat 登录' : 'GitChat 注册';
                document.getElementById('submitBtn').innerText = isLoginMode ? '登录' : '注册';
                document.getElementById('toggleFormBtn').innerText = isLoginMode ? '没有账号？去注册' :
                    '已有账号？去登录';
                document.getElementById('formMessage').innerText = '';
                document.getElementById('formMessage').className = 'error';
            };
            document.getElementById('loginPassword').onkeypress = (e) => { if (e.key === 'Enter') handleSubmit(); };

            window.addEventListener('beforeunload', () => { saveUnread();
                saveLastSeen(); });
        })();
    </script>
